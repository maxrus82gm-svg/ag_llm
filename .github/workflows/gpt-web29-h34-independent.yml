# H34 independent guarded Windows test CI; no live OAuth/API/paid use.
name: WEB29 H34 independent Windows OFFLINE
on:
  push:
    branches: [GPT]
    paths:
      - .github/workflows/gpt-web29-h34-independent.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-legacy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*.py
            /*.js
            /*.json
            /web_alarm/
            /reports/CODEX-WUA-CHAT-GIGACHAT-REAL-READINESS-S3B-001/
            /reports/CODEX-WUA-CHAT-GIGACHAT-TRANSPORT-OFFLINE-GATE-001/
            /reports/CODEX-WUA-CHAT-ORDINARY-CORE-BRIDGE-001/guard/
            /reports/CODEX-WUA-CHAT-S3B-ORDINARY-FAKE-ADMISSION-001/
            /reports/CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001/
            /reports/CODEX-WUA-CHAT-ORDINARY-TEST-ACTIVATION-001/
            /reports/CODEX-RT002-B2-S3A-DURABLE-LEDGER-001/
            /reports/CODEX-RT002-B2-S2-ISOLATION-ORACLE-REPAIR-001/isolation_checks.py
            /.github/workflows/gpt-web29-h34-independent.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create isolated Python and TEMP, record immutable source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'C:\h34_ci') { throw 'Unexpected preexisting synthetic TEMP' }
          New-Item -ItemType Directory 'C:\h34_ci\la' -Force | Out-Null
          'TEMP=C:\h34_ci' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'TMP=C:\h34_ci' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'TMPDIR=C:\h34_ci' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'LOCALAPPDATA=C:\h34_ci\la' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory 'ci-h34-evidence' -Force | Out-Null
          git rev-parse HEAD | Set-Content 'ci-h34-evidence/source_sha.txt'
          python --version
          node --version
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Windows venv unavailable' }
          & .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-input 'httpx==0.28.1' 'mcp==2.2.0' 'pytest==9.1.1'
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependencies unavailable' }
      - name: Verify all H34 manifest source pins before runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='reports/CODEX-WUA-CHAT-GIGACHAT-REAL-READINESS-S3B-001'
          & .\.venv\Scripts\python.exe -c "import json,pathlib,hashlib,sys; m=json.loads(pathlib.Path('$p/manifest.json').read_text(encoding='utf-8')); pins=m['source_before_after']; matches=[(name, (lambda b,w: hashlib.sha256(b).hexdigest()==w or hashlib.sha256(b.replace(bytes([13,10]),bytes([10])).replace(bytes([10]),bytes([13,10]))).hexdigest()==w)(pathlib.Path(name).read_bytes(), record['after'])) for name,record in pins.items()]; print('H34_SOURCE_PINS:',len(matches),'MATCH',sum(ok for _,ok in matches)); print('MISMATCH:',[name for name,ok in matches if not ok]); sys.exit(0 if len(matches)==16 and all(ok for _,ok in matches) else 1)" > ci-h34-evidence/pins.log 2>&1
          $rc=$LASTEXITCODE
          Get-Content ci-h34-evidence/pins.log
          if ($rc -ne 0) { throw 'SOURCE SHA mismatch; stop before runtime tests' }
      - name: H34_legacy
        if: '!cancelled()'
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem Env:GIGACHAT_* -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item ('Env:'+$_.Name) }
          $p='reports/CODEX-WUA-CHAT-GIGACHAT-REAL-READINESS-S3B-001'
          & .\.venv\Scripts\python.exe -B -X utf8 "$p/run_checks.py" ci_h34_legacy test_gigachat_admission.py test_planner_session.py test_planner_diagnostics.py test_provider_attempt_integration.py test_verifier_runtime.py test_final_audit.py test_task_planner.py > 'ci-h34-evidence/H34_legacy.log' 2>&1
          $rc=$LASTEXITCODE
          Get-Content 'ci-h34-evidence/H34_legacy.log' -Tail 55
          if ($rc -ne 0) { throw 'H34_legacy runner failed; exit='+$rc }
          $v=Get-Content "$p/evidence/ci_h34_legacy.result.json" -Raw | ConvertFrom-Json
          if ($v.exit_code -ne 0 -or $v.runner_exit_code -ne 0 -or $v.unexpected_guard_denials -ne 0 -or $v.counts.'test:passed' -ne 244 -or $v.counts.'subtest:passed' -ne 110 -or $v.counts.'test:failed' -or $v.counts.'test:skipped' -or $v.counts.'test:error') { throw 'H34 legacy counts/guard/exit mismatch' }
          Write-Output 'H34_LEGACY=244_PASS_110_SUBTESTS_0_UNEXPECTED_GUARDS'
      - name: Collect bounded evidence even when tests fail
        if: always()
        shell: pwsh
        run: |
          $dest='ci-h34-evidence'
          New-Item -ItemType Directory $dest -Force | Out-Null
          $source='reports/CODEX-WUA-CHAT-GIGACHAT-REAL-READINESS-S3B-001/evidence'
          Get-ChildItem $source -File -Filter 'ci_h34_*' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dest -Force }
          Write-Output ('CI_H34_COLLECTED='+(Get-ChildItem $dest -File).Count)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h34-independent-legacy
          path: ci-h34-evidence/
          if-no-files-found: warn
          retention-days: 14

