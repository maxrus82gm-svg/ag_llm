name: WEB24 Independent S4 Deadline H18 Windows Gate
on:
  push:
    branches: [GPT]
    paths:
      - .github/workflows/gpt-s4-deadline-independent.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*.py
            /web_alarm/
            /reports/CODEX-WUA-CHAT-S4-DEADLINE-UNKNOWN-REPAIR-001/guard/
            /reports/CHATGPT-WEB24-CODEX-S4-DEADLINE-REVIEW-20261106/test_independent_deadline.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        shell: pwsh
        run: python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Show exact source, version and digest
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          python -B -X utf8 -c "import hashlib, pathlib; p=pathlib.Path('ordinary_chat_service.py'); print('ordinary_chat_service.sha256',hashlib.sha256(p.read_bytes().replace(bytes([13,10]),bytes([10]))).hexdigest())"
      - name: Independent reviewer deadline and cancellation oracles
        id: reviewer
        continue-on-error: true
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\independent.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-DEADLINE-UNKNOWN-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest discover -s reports/CHATGPT-WEB24-CODEX-S4-DEADLINE-REVIEW-20261106 -p test_independent_deadline.py -v
      - name: Independent S4A final suite (strict network guard)
        id: s4a
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\s4a.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-DEADLINE-UNKNOWN-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_ordinary_chat_service
      - name: Independent S4B Turn integration (strict network guard)
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\s4b.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-DEADLINE-UNKNOWN-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat_turn_s4b
      - name: Independent legacy Stage3 and HTTP
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\stage3.guard.jsonl
          ORDINARY_GUARD_NETWORK: loopback
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-DEADLINE-UNKNOWN-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat_turn_service test_web_alarm_ultra_chat_turn_http test_web_alarm_ultra_chat_turn
      - name: Independent RAW storage regression
        shell: pwsh
        run: python -B -X utf8 -m unittest -v test_ultra_chat_storage.RawIdempotencyTests test_ultra_chat_storage.CrashTests test_ultra_chat_storage.PathSafetyTests
      - name: Independent Run Store v2 regression
        shell: pwsh
        run: python -B -X utf8 -m pytest -q -p no:cacheprovider test_run_store_v2.py
      - name: Guard logging
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "${{ runner.temp }}" -Filter "*.guard.jsonl" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "$($_.Name): $((Get-Content $_.FullName).Count) lines" }
      - name: Reviewer gate cannot be hidden
        if: always()
        shell: pwsh
        run: |
          Write-Output "reviewer outcome=${{ steps.reviewer.outcome }}"
          if ("${{ steps.reviewer.outcome }}" -ne "success") { throw "Independent reviewer found a failing safety contract" }
