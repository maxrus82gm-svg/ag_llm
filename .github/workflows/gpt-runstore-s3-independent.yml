# Independent Windows tests for the published Stage 3 Run Store prerequisites.
# Sparse checkout avoids legacy reports paths that break Windows full checkout.
name: GPT Run Store Stage3 independent Windows gate

on:
  push:
    branches: [GPT]
    paths:
      - '.github/workflows/gpt-runstore-s3-independent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-runstore-s3-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-prerequisites:
    name: Windows / Run Store + Stage3 prerequisites
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      TMPDIR: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - name: Checkout only six approved source and test files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /context_storage.py
            /audit_storage.py
            /run_store.py
            /test_run_store_v2.py
            /test_audit_v2_compatibility.py
            /test_web_alarm_ultra_chat_turn.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact test runner
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Confirm commit, isolation and source hashes
        shell: pwsh
        run: |
          python --version
          python -m pytest --version
          Write-Host "HEAD ${{ github.sha }}"
          foreach ($file in @('context_storage.py','audit_storage.py','run_store.py','test_run_store_v2.py','test_audit_v2_compatibility.py','test_web_alarm_ultra_chat_turn.py')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing source $file" }
            Get-FileHash -Algorithm SHA256 -LiteralPath $file | Format-Table -HideTableHeaders
          }
          if (Test-Path -LiteralPath 'reports') { throw "Reports directory unexpectedly checked out" }

      - name: Run Store plus audit compatibility tests
        id: runstore
        shell: pwsh
        run: |
          python -B -X utf8 -m pytest -q -p no:cacheprovider test_run_store_v2.py test_audit_v2_compatibility.py *>&1 | Tee-Object -FilePath runstore-windows.log
          $result = $LASTEXITCODE
          Write-Host "RUNSTORE_EXIT=$result"
          if ($result -ne 0) { exit $result }

      - name: Stage 3 original prerequisite oracles
        id: prerequisites
        if: always() && steps.runstore.outcome != 'skipped'
        shell: pwsh
        run: |
          python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat_turn *>&1 | Tee-Object -FilePath prerequisites-windows.log
          $result = $LASTEXITCODE
          Write-Host "PREREQUISITES_EXIT=$result"
          if ($result -ne 0) { exit $result }

      - name: Upload factual logs (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runstore-s3-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runstore-windows.log
            prerequisites-windows.log
          if-no-files-found: warn
          retention-days: 14
