name: Independent Run Store Windows Gate
on:
  push:
    branches:
      - GPT
    paths:
      - .github/workflows/gpt-runstore-s3-independent.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /context_storage.py
            /audit_storage.py
            /run_store.py
            /test_run_store_v2.py
            /test_audit_v2_compatibility.py
            /test_web_alarm_ultra_chat_turn.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      - name: Run Store and audit
        run: python -B -X utf8 -m pytest -q -p no:cacheprovider test_run_store_v2.py test_audit_v2_compatibility.py
      - name: Stage3 prerequisite oracles
        run: python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat_turn
