# WA4-E smoke, WA4-A/WA4-O regression, and independent WA4-R OBSERVE acceptance.
# PRs run focused and full regression; manual runs can disable the full suite.
# CI uses isolated temporary fixtures; it never targets live Workspace storage.
name: Web Alarm smoke

on:
  push:
    branches:
      - GPT
    paths:
      - '.github/workflows/web-alarm-tests.yml'
      - 'web_alarm/**'
      - 'test_web_alarm_*.py'
      - 'test_web_alarm_*.js'
      - 'wa4a_acceptance.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/web-alarm-tests.yml'
      - 'web_alarm/**'
      - 'test_web_alarm_*.py'
      - 'test_web_alarm_*.js'
      - 'wa4a_acceptance.py'
  workflow_dispatch:
    inputs:
      run_full_regression:
        description: 'Also run the complete Web Alarm regression suite'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: web-alarm-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wa4e-smoke:
    name: WA4-E smoke / Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python
        run: python --version

      - name: Run five isolated WA4-E tests
        run: >-
          python -B -m unittest -v
          test_web_alarm_mutation_executor.PositiveTests.test_started_is_persisted_before_the_first_physical_write
          test_web_alarm_mutation_executor.PositiveTests.test_replay_of_the_same_contract_never_repeats_the_side_effect
          test_web_alarm_mutation_executor.PositiveTests.test_create_and_delete
          test_web_alarm_mutation_executor.AdmissionTests.test_changed_pre_state_is_never_overwritten
          test_web_alarm_mutation_executor.AdmissionTests.test_closed_and_archived_tasks_admit_nothing

  wa4a-regression:
    name: WA4-A focused + full / Python 3.12 / Windows
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run guarded WA4-A focused acceptance (166 tests at baseline)
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          python -B wa4a_acceptance.py --output "${{ runner.temp }}/wa4a-focused"
          test_web_alarm_lost_response
          test_web_alarm_mutation_executor
          test_web_alarm_operation_contract
          test_web_alarm_operation_store
          test_web_alarm_target_claims
          test_web_alarm_resolver
          test_web_alarm_recovery_coordinator

      - name: Run guarded WA4-O operator HTTP acceptance
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          python -B wa4a_acceptance.py --task CODEX-WA4-O-001
          --output "${{ runner.temp }}/wa4o-focused"
          test_web_alarm_operator_ui
          test_web_alarm_ui_launcher

      - name: Run guarded WA4-R OBSERVE acceptance (Codex reported 228 focused)
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          python -B wa4a_acceptance.py --task CODEX-WA4-R-001
          --output "${{ runner.temp }}/wa4r-focused"
          test_web_alarm_observation
          test_web_alarm_mutation_executor
          test_web_alarm_lost_response
          test_web_alarm_target_claims
          test_web_alarm_target_claims_concurrency
          test_web_alarm_cli
          test_web_alarm_server
          test_web_alarm_projection_repair2
          test_web_alarm_recovery_coordinator_repair4b
          test_web_alarm_rollback

      - name: Run guarded WA4-R diagnostic closeout race (20 repeats, 80 rounds)
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $target = "test_web_alarm_projection_concurrency.ProjectionRaceTests.test_completion_never_admits_new_open_state"
          $repeatTargets = @(1..20 | ForEach-Object { $target })
          python -B wa4a_acceptance.py --task CODEX-WA4-R-001-DIAG-01 --output "${{ runner.temp }}/wa4r-diag" @repeatTargets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run WA4-O shipped JavaScript client tests
        run: node --test test_web_alarm_operator_ui.js

      - name: Run guarded full Web Alarm regression (719 tests at WA4-O baseline)
        if: github.event_name == 'pull_request' || inputs.run_full_regression
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          python -B wa4a_acceptance.py --output "${{ runner.temp }}/wa4a-full" all

      - name: Upload test results and isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa4a-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wa4a-focused/results.json
            ${{ runner.temp }}/wa4a-focused/isolation.jsonl
            ${{ runner.temp }}/wa4a-full/results.json
            ${{ runner.temp }}/wa4a-full/isolation.jsonl
            ${{ runner.temp }}/wa4o-focused/results.json
            ${{ runner.temp }}/wa4o-focused/isolation.jsonl
            ${{ runner.temp }}/wa4r-focused/results.json
            ${{ runner.temp }}/wa4r-focused/isolation.jsonl
            ${{ runner.temp }}/wa4r-diag/results.json
            ${{ runner.temp }}/wa4r-diag/isolation.jsonl
          if-no-files-found: warn
          retention-days: 7

  wa4r-diag-isolated:
    name: WA4-R DIAG / 80 race rounds / Windows
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run guarded WA4-R closeout diagnostic separately (80 rounds)
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $target = "test_web_alarm_projection_concurrency.ProjectionRaceTests.test_completion_never_admits_new_open_state"
          $cases = @(1..20 | ForEach-Object { $target })
          python -B wa4a_acceptance.py --task CODEX-WA4-R-001-DIAG-01 --output "${{ runner.temp }}/diag-independent" @cases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload independent WA4-R diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa4r-diag-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/diag-independent/results.json
            ${{ runner.temp }}/diag-independent/isolation.jsonl
          if-no-files-found: warn
          retention-days: 7

  wa4a-close-race:
    name: WA4-A direct-close race / 80 rounds / Windows
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated WA4-A mutation versus direct TASK closure (80 rounds)
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $target = "test_web_alarm_mutation_executor.RaceTests.test_execution_racing_the_task_closure_never_writes_into_a_closed_task"
          $cases = @(1..20 | ForEach-Object { $target })
          python -B wa4a_acceptance.py --task CODEX-WA4-R-001-DIAG-01 --output "${{ runner.temp }}/wa4a-close-race" @cases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload independent direct-close race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa4a-close-race-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wa4a-close-race/results.json
            ${{ runner.temp }}/wa4a-close-race/isolation.jsonl
          if-no-files-found: warn
          retention-days: 7
