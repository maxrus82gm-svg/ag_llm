# Commits 256/260: WA4-E smoke and guarded WA4-A acceptance/regression.
# PRs run focused and full regression; manual runs can disable the full suite.
# CI uses isolated temporary fixtures; it never targets live Workspace storage.
name: Web Alarm smoke

on:
  push:
    branches:
      - GPT
    paths:
      - '.github/workflows/web-alarm-tests.yml'
      - 'web_alarm/**'
      - 'test_web_alarm_*.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/web-alarm-tests.yml'
      - 'web_alarm/**'
      - 'test_web_alarm_*.py'
  workflow_dispatch:
    inputs:
      run_full_regression:
        description: 'Also run the complete Web Alarm suite (689 tests at WA4-A baseline)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: web-alarm-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wa4e-smoke:
    name: WA4-E smoke / Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python
        run: python --version

      - name: Run five isolated WA4-E tests
        run: >-
          python -B -m unittest -v
          test_web_alarm_mutation_executor.PositiveTests.test_started_is_persisted_before_the_first_physical_write
          test_web_alarm_mutation_executor.PositiveTests.test_replay_of_the_same_contract_never_repeats_the_side_effect
          test_web_alarm_mutation_executor.PositiveTests.test_create_and_delete
          test_web_alarm_mutation_executor.AdmissionTests.test_changed_pre_state_is_never_overwritten
          test_web_alarm_mutation_executor.AdmissionTests.test_closed_and_archived_tasks_admit_nothing

  wa4a-regression:
    name: WA4-A focused + full / Python 3.12 / Windows
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run guarded WA4-A focused acceptance (166 tests at baseline)
        run: >-
          python -B wa4a_acceptance.py --output "${{ runner.temp }}/wa4a-focused"
          test_web_alarm_lost_response
          test_web_alarm_mutation_executor
          test_web_alarm_operation_contract
          test_web_alarm_operation_store
          test_web_alarm_target_claims
          test_web_alarm_resolver
          test_web_alarm_recovery_coordinator

      - name: Run guarded full Web Alarm regression (689 tests at baseline)
        if: github.event_name == 'pull_request' || inputs.run_full_regression
        run: >-
          python -B wa4a_acceptance.py --output "${{ runner.temp }}/wa4a-full" all

      - name: Upload test results and isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa4a-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wa4a-focused/results.json
            ${{ runner.temp }}/wa4a-focused/isolation.jsonl
            ${{ runner.temp }}/wa4a-full/results.json
            ${{ runner.temp }}/wa4a-full/isolation.jsonl
          if-no-files-found: warn
          retention-days: 7
