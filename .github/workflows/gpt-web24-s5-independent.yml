name: WEB24 H20 independent Stage5 OFFLINE Windows
on:
  push:
    branches: [GPT]
    paths:
      - .github/workflows/gpt-web24-s5-independent.yml
      - reports/CHATGPT-WEB24-CODEX-S5-REVIEW-20261107/check_manifest.py
      - reports/CHATGPT-WEB24-CODEX-S5-REVIEW-20261107/test_independent_s5.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*.py
            /*.js
            /web_alarm/
            /reports/CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001/
            /reports/CHATGPT-WEB24-CODEX-S5-REVIEW-20261107/
            /reports/task_history_sequences.json
            /Документация/000_Задачи Codex.md
            /Start_WebAlarm.bat
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        shell: pwsh
        run: python -m pip install "httpx==0.28.1" "pytest==9.1.1" "mcp==2.2.0"
      - name: Source identity and author manifest 83 exact SHA
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          node --version
          python -B -X utf8 reports/CHATGPT-WEB24-CODEX-S5-REVIEW-20261107/check_manifest.py
      - name: Independent three additional Stage5 boundary oracles
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\review.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest discover -s reports/CHATGPT-WEB24-CODEX-S5-REVIEW-20261107 -p test_independent_s5.py -v
      - name: Full Stage5 HTTP and Tk real widgets
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\s5.guard.jsonl
          ORDINARY_GUARD_NETWORK: loopback
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat_s5
      - name: Repeat final HTTP client disconnection recovery 10x
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\disconnect.guard.jsonl
          ORDINARY_GUARD_NETWORK: loopback
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001\\guard;${{ github.workspace }}
        run: |
          $fails=0
          for ($i=1; $i -le 10; $i++) {
            python -B -X utf8 -m unittest -q test_web_alarm_ultra_chat_s5.HttpAndTkTests.test_http_reply_disconnect_does_not_replace_success_with_500_or_repeat
            if ($LASTEXITCODE -ne 0) {$fails++}
          }
          Write-Output "S5_DISCONNECT_STRESS rounds=10 failures=$fails"
          if ($fails -gt 0) {throw "HTTP disconnect repeated oracle failed"}
      - name: Web history and storage service
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\history.guard.jsonl
          ORDINARY_GUARD_NETWORK: loopback
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat test_web_alarm_ultra_chat_storage
      - name: Stage4A and Stage4B regression
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\s4.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_ordinary_chat_service test_web_alarm_ultra_chat_turn_s4b
      - name: Stage3 Turn HTTP regression
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\s3.guard.jsonl
          ORDINARY_GUARD_NETWORK: loopback
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat_turn_service test_web_alarm_ultra_chat_turn_http test_web_alarm_ultra_chat_turn
      - name: RAW idempotency crash and path regression
        shell: pwsh
        run: python -B -X utf8 -m unittest -v test_ultra_chat_storage.RawIdempotencyTests test_ultra_chat_storage.CrashTests test_ultra_chat_storage.PathSafetyTests
      - name: Run Store v2 full regression
        shell: pwsh
        run: python -B -X utf8 -m pytest -q -p no:cacheprovider test_run_store_v2.py
      - name: Independent JavaScript web operator EVM
        shell: pwsh
        run: node --test test_web_alarm_ultra_chat_ui.js test_web_alarm_operator_ui.js test_web_alarm_evm_ui.js
      - name: Strict network and secrets guard lines
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "${{ runner.temp }}" -Filter "*.guard.jsonl" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "$($_.Name): $((Get-Content $_.FullName).Count) lines" }
