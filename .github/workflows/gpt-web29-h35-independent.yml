# Independent H35 NORMAL application + legacy + safety Windows CI. REAL IS DISABLED.
name: WEB29 H35 independent Windows OFFLINE
on:
  push:
    branches: [GPT]
    paths:
      - .github/workflows/gpt-web29-h35-independent.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application-and-legacy:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*.py
            /*.js
            /*.json
            /web_alarm/
            /reports/CODEX-WUA-CHAT-GIGACHAT-ONE-MODEL-REAL-PREFLIGHT-001/
            /reports/CODEX-WUA-CHAT-GIGACHAT-REAL-READINESS-S3B-001/
            /reports/CODEX-WUA-CHAT-GIGACHAT-TRANSPORT-OFFLINE-GATE-001/
            /reports/CODEX-WUA-CHAT-ORDINARY-CORE-BRIDGE-001/guard/
            /reports/CODEX-WUA-CHAT-S3B-ORDINARY-FAKE-ADMISSION-001/
            /reports/CODEX-WUA-CHAT-S5-OFFLINE-FULL-CHAT-001/
            /reports/CODEX-WUA-CHAT-ORDINARY-TEST-ACTIVATION-001/
            /reports/CODEX-RT002-B2-S3A-DURABLE-LEDGER-001/
            /reports/CODEX-RT002-B2-S2-ISOLATION-ORACLE-REPAIR-001/isolation_checks.py
            /Документация/000_Задачи Codex.md
            /.github/workflows/gpt-web29-h35-independent.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated TEMP, virtualenv and immutable source record
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'C:\h35_independent') { throw 'Unexpected CI TEMP exists' }
          New-Item -ItemType Directory 'C:\h35_independent\la' -Force | Out-Null
          'TEMP=C:\h35_independent' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'TMP=C:\h35_independent' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'TMPDIR=C:\h35_independent' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'LOCALAPPDATA=C:\h35_independent\la' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory ci-h35-evidence -Force | Out-Null
          git rev-parse HEAD | Set-Content ci-h35-evidence/source_commit.txt
          python --version
          node --version
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Venv failure' }
          & .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check --no-input 'httpx==0.28.1' 'mcp==2.2.0' 'pytest==9.1.1'
          if ($LASTEXITCODE -ne 0) { throw 'Offline test dependencies unavailable' }
      - name: Verify all H35 manifest source pins
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $code=@'
          import hashlib, json, pathlib, sys
          p=pathlib.Path('reports/CODEX-WUA-CHAT-GIGACHAT-ONE-MODEL-REAL-PREFLIGHT-001/manifest.json')
          pins=json.loads(p.read_text(encoding='utf-8'))['sources']
          result=[]
          for path,entry in pins.items():
              try:
                  b=pathlib.Path(path).read_bytes()
                  candidates=(b,b.replace(b'\r\n',b'\n'),b.replace(b'\r\n',b'\n').replace(b'\n',b'\r\n'))
                  ok=any(hashlib.sha256(v).hexdigest()==entry['after'] for v in candidates)
              except OSError:
                  ok=False
              result.append((path,ok))
          print('H35_SOURCE_PINS:',len(result),'MATCH',sum(ok for _,ok in result))
          print('MISMATCH:',[p for p,ok in result if not ok])
          sys.exit(0 if len(result)==18 and all(ok for _,ok in result) else 1)
          '@
          $code | & .\.venv\Scripts\python.exe -B - > ci-h35-evidence/pins.log 2>&1
          $rc=$LASTEXITCODE
          Get-Content ci-h35-evidence/pins.log
          if ($rc -ne 0) { throw 'H35 source SHA mismatched' }
      - name: H35_application
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem Env:GIGACHAT_* -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item ('Env:'+$_.Name) }
          $p='reports/CODEX-WUA-CHAT-GIGACHAT-ONE-MODEL-REAL-PREFLIGHT-001'
          & .\.venv\Scripts\python.exe -B -X utf8 "$p/run_checks.py" ci_h35_application test_web_alarm_ordinary_application.py > "ci-h35-evidence/H35_application.log" 2>&1
          $rc=$LASTEXITCODE
          Get-Content "ci-h35-evidence/H35_application.log" -Tail 30
          if ($rc -ne 0) { throw 'H35_application runner exited '+$rc }
          $x=Get-Content "$p/evidence/ci_h35_application.result.json" -Raw | ConvertFrom-Json
          if ($x.exit_code -ne 0 -or $x.runner_exit_code -ne 0 -or $x.unexpected_guard_denials -ne 0 -or $x.counts.'test:passed' -ne 7 -or $x.counts.'subtest:passed' -ne 10 -or $x.expected_guard_denials -ne 0 -or $x.counts.'test:failed' -or $x.counts.'test:error' -or $x.counts.'test:skipped') { throw 'Unexpected counts, exit or guard deviations' }
          Write-Output 'H35_application=7_TESTS_10_SUBTESTS_0_EXPECTED_GUARDS'
      - name: H35_legacy
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem Env:GIGACHAT_* -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item ('Env:'+$_.Name) }
          $p='reports/CODEX-WUA-CHAT-GIGACHAT-ONE-MODEL-REAL-PREFLIGHT-001'
          & .\.venv\Scripts\python.exe -B -X utf8 "$p/run_checks.py" ci_h35_legacy test_gigachat_admission.py test_planner_session.py test_planner_diagnostics.py test_provider_attempt_integration.py test_verifier_runtime.py test_final_audit.py test_task_planner.py > "ci-h35-evidence/H35_legacy.log" 2>&1
          $rc=$LASTEXITCODE
          Get-Content "ci-h35-evidence/H35_legacy.log" -Tail 30
          if ($rc -ne 0) { throw 'H35_legacy runner exited '+$rc }
          $x=Get-Content "$p/evidence/ci_h35_legacy.result.json" -Raw | ConvertFrom-Json
          if ($x.exit_code -ne 0 -or $x.runner_exit_code -ne 0 -or $x.unexpected_guard_denials -ne 0 -or $x.counts.'test:passed' -ne 244 -or $x.counts.'subtest:passed' -ne 110 -or $x.expected_guard_denials -ne 0 -or $x.counts.'test:failed' -or $x.counts.'test:error' -or $x.counts.'test:skipped') { throw 'Unexpected counts, exit or guard deviations' }
          Write-Output 'H35_legacy=244_TESTS_110_SUBTESTS_0_EXPECTED_GUARDS'
      - name: Capture H35 independent evidence
        if: always()
        shell: pwsh
        run: |
          $src='reports/CODEX-WUA-CHAT-GIGACHAT-ONE-MODEL-REAL-PREFLIGHT-001/evidence'
          New-Item -ItemType Directory ci-h35-evidence -Force | Out-Null
          Get-ChildItem $src -File -Filter 'ci_h35_*' -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination ci-h35-evidence -Force
          }
          'H35_S1_PINNED_RAW=NOT_RUN (historical RAW missing from GitHub checkout)' | Set-Content ci-h35-evidence/S1_not_run.txt
          Write-Output ('EVIDENCE_FILES='+(Get-ChildItem ci-h35-evidence -File).Count)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h35-independent-application-legacy
          path: ci-h35-evidence/
          retention-days: 14
          if-no-files-found: warn

