name: WEB24 H19 Independent Windows Cancellation Gate
on:
  push:
    branches: [GPT]
    paths:
      - .github/workflows/gpt-web24-h19-cancel-independent.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*.py
            /web_alarm/
            /reports/CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001/guard/
            /reports/CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001/probe_turn.py
            /reports/CHATGPT-WEB24-CODEX-S4-CANCEL-REVIEW-20261106/test_independent_cancel.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        shell: pwsh
        run: python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Pin HEAD and source
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          python -B -X utf8 -c "import hashlib,pathlib; p=pathlib.Path('ordinary_chat_service.py'); print(hashlib.sha256(p.read_bytes().replace(bytes([13,10]),bytes([10]))).hexdigest())"
      - name: Independent cancellation and deadline oracles
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\review.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest discover -v -s reports/CHATGPT-WEB24-CODEX-S4-CANCEL-REVIEW-20261106 -p test_independent_cancel.py
      - name: S4A common service
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\s4a.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_ordinary_chat_service
      - name: S4B Turn integration
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\s4b.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat_turn_s4b
      - name: Durable external-cancel reopen
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\turn-probe.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 reports/CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001/probe_turn.py
      - name: Stress suppressed cancellation and late deadline 30 rounds
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\stress.guard.jsonl
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001\\guard;${{ github.workspace }}
        run: |
          $fails = 0
          for ($i = 1; $i -le 30; $i++) {
            python -B -X utf8 -m unittest -q test_ordinary_chat_service.ExecutionContract.test_external_cancel_suppressed_by_transport_cannot_publish_success test_ordinary_chat_service.ExecutionContract.test_swallowed_timeout_cannot_publish_late_success
            if ($LASTEXITCODE -ne 0) { $fails++ }
          }
          Write-Output "H19_STRESS rounds=30 tests=60 failures=$fails"
          if ($fails -gt 0) { throw "Regression FAIL" }
      - name: Stage3 Turn and HTTP loopback
        shell: pwsh
        env:
          ORDINARY_GUARD_ROOT: ${{ github.workspace }}
          ORDINARY_GUARD_LOG: ${{ runner.temp }}\\stage3.guard.jsonl
          ORDINARY_GUARD_NETWORK: loopback
          PYTHONPATH: ${{ github.workspace }}\\reports\\CODEX-WUA-CHAT-S4-CANCEL-SUPPRESSED-REPAIR-001\\guard;${{ github.workspace }}
        run: python -B -X utf8 -m unittest -v test_web_alarm_ultra_chat_turn_service test_web_alarm_ultra_chat_turn_http test_web_alarm_ultra_chat_turn
      - name: RAW storage regression
        shell: pwsh
        run: python -B -X utf8 -m unittest -v test_ultra_chat_storage.RawIdempotencyTests test_ultra_chat_storage.CrashTests test_ultra_chat_storage.PathSafetyTests
      - name: Run Store integrity
        shell: pwsh
        run: python -B -X utf8 -m pytest -q -p no:cacheprovider test_run_store_v2.py
      - name: Guard evidence
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "${{ runner.temp }}" -Filter "*.guard.jsonl" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "$($_.Name): $((Get-Content $_.FullName).Count) lines" }
